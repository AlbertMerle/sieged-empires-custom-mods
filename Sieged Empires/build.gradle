plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
	maven {
		name = 'AlexIIL'
		url = 'https://staging.alexiil.uk/maven/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Ladysnake'
		url = 'https://maven.ladysnake.org/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"siegedempires" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation 'com.google.code.gson:gson:2.11.0'

	// Cloth Config API (pack ships cloth-config-26.2.155.jar; required by SE + WeaponMod)
	implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
	localRuntime files("libs/cloth-config-26.2.155.jar")

	// GlitchCore
	implementation "maven.modrinth:glitchcore:26.2.0.0.0"

	// LibGUI (bundled — no separate install required)
	// Loom 1.17 does not expose modImplementation; implementation + include is the equivalent.
	implementation "io.github.cottonmc:LibGui:${project.libgui_version}"
	include "io.github.cottonmc:LibGui:${project.libgui_version}"

	// Soft dependency: Squaremap (claims layer on web map)
	compileOnly "xyz.jpenilla:squaremap-api:1.3.15"

	// Soft dependency: Balkon's WeaponMod (explosion protection mixin)
	compileOnly files("libs/weaponmod-fabric-26.2-1.25.0.jar")
	localRuntime files("libs/weaponmod-fabric-26.2-1.25.0.jar")

	// Soft dependency: Shippy Ships (compile against local jars; optional at runtime)
	compileOnly files("libs/shippy-ships-1.0.16-FABRIC-MC-26.2.jar")
	compileOnly files("libs/ingeniumapi-1.0.2-FABRIC-MC-26.X.jar")
	localRuntime files("libs/shippy-ships-1.0.16-FABRIC-MC-26.2.jar")
	localRuntime files("libs/ingeniumapi-1.0.2-FABRIC-MC-26.X.jar")

	// Dev runtime: FZMM + owo (also in run/mods/). Compile against them only for client sources —
	// owo interface-injection must not sit on the main compile classpath.
	localRuntime files("libs/fzmm-mc26.2-0.2.20.jar")
	localRuntime files("libs/owo-lib-0.13.1+26.2.jar")

	// Dev runtime: Sodium + Iris for shader / LabPBR testing (also in run/mods/, BSL in run/shaderpacks/)
	localRuntime files("libs/sodium-fabric-0.9.1+mc26.2.jar")
	localRuntime files("libs/iris-fabric-1.11.2+mc26.2.jar")
}

sourceSets {
	client {
		compileClasspath += files("libs/fzmm-mc26.2-0.2.20.jar", "libs/owo-lib-0.13.1+26.2.jar")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
