plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://api.modrinth.com/maven' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"weaponsmodaddon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WeaponMod + hard deps (compile against local jars; do not shade/include).
	// localRuntime + run/mods/ so ./gradlew runClient loads them.
	compileOnly files("libs/weaponmod-fabric-26.2-1.25.0.jar")
	compileOnly files("libs/architectury-fabric-21.0.6.jar")
	compileOnly files("libs/cloth-config-26.2.155.jar")
	localRuntime files("libs/weaponmod-fabric-26.2-1.25.0.jar")
	localRuntime files("libs/architectury-fabric-21.0.6.jar")
	localRuntime files("libs/cloth-config-26.2.155.jar")

	// Camera stack (client): Perspective API + Shoulder Surfing (+ Forge Config API Port).
	// Soft at runtime (suggests in fabric.mod.json); jars also in run/mods/ for Loom.
	compileOnly files("libs/perspective_api-1.4.0-beta+fabric-26.2.jar")
	compileOnly files("libs/ShoulderSurfing-Fabric-26.2-5.0.7.jar")
	compileOnly files("libs/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar")
	localRuntime files("libs/perspective_api-1.4.0-beta+fabric-26.2.jar")
	localRuntime files("libs/ShoulderSurfing-Fabric-26.2-5.0.7.jar")
	localRuntime files("libs/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
